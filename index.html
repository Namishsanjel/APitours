<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logo-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover guided tours, scenic mountain destinations, curated outdoor adventures, and stress-free holiday planning with API Touch."
    />
    <!--
      Open Graph / Twitter card images. These must be absolute URLs, so the
      production origin has to be known at build time. Set VITE_SITE_ORIGIN
      (e.g. VITE_SITE_ORIGIN=https://www.your-domain.com) before building;
      until then they point at the logo by relative path, which some scrapers
      will reject. See src/data/content.js for the same origin variable.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="API Touch" />
    <meta property="og:title" content="API Touch - Guided Tours &amp; Vacations" />
    <meta
      property="og:description"
      content="Discover guided tours, scenic mountain destinations, curated outdoor adventures, and stress-free holiday planning with API Touch."
    />
    <meta property="og:image" content="/logo-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="API Touch - Guided Tours &amp; Vacations" />
    <meta
      name="twitter:description"
      content="Discover guided tours, scenic mountain destinations, curated outdoor adventures, and stress-free holiday planning with API Touch."
    />
    <meta name="twitter:image" content="/logo-512.png" />
    <title>API Touch - Guided Tours &amp; Vacations</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
